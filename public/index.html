  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Plus Jakarta Sans', 'Anek Bangla', 'Hind Siliguri', -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
      background-color: #08080a;
      color: #f4f4f5;
    }

    /* Subtle ambient mesh glow in background */
    .ambient-glow {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(circle at 50% 12%, rgba(255, 255, 255, 0.035) 0%, transparent 60%);
      z-index: 0;
    }

    /* Minimalist Scrollbar */
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.12); border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.22); }

    /* Exact Reference: Lightbulb Thinking Shimmer Beam */
    @keyframes thinkingBeam {
      0% { background-position: -150% 0; }
      100% { background-position: 150% 0; }
    }
    .thinking-shimmer {
      background: linear-gradient(
        90deg,
        #71717a 0%,
        #71717a 20%,
        #ffffff 50%,
        #71717a 80%,
        #71717a 100%
      );
      background-size: 200% 100%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: thinkingBeam 2.4s infinite ease-in-out;
      display: inline-block;
      vertical-align: middle;
    }

    /* Exact Reference: Dotted Thought Tree */
    .thought-tree {
      transition: max-height 0.28s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.2s ease, margin 0.2s ease;
      overflow: hidden;
    }
    .thought-tree.collapsed {
      max-height: 0px !important;
      opacity: 0 !important;
      margin-top: 0px !important;
      margin-bottom: 0px !important;
      border-left-color: transparent !important;
    }
    .thought-sub-content {
      transition: max-height 0.22s ease, opacity 0.18s ease;
      overflow: hidden;
    }
    .thought-sub-content.collapsed {
      max-height: 0px !important;
      opacity: 0 !important;
      padding-top: 0px !important;
      padding-bottom: 0px !important;
    }

    /* Markdown Styling */
    .markdown-body p { margin-bottom: 0.85rem; line-height: 1.75; font-size: 0.9375rem; color: #d4d4d8; }
    .markdown-body p:last-child { margin-bottom: 0; }
    
    .markdown-body ul { list-style-type: none; margin-left: 0; padding-left: 0; margin-top: 0.35rem; margin-bottom: 0.85rem; }
    .markdown-body ul li { position: relative; padding-left: 1.25rem; margin-bottom: 0.4rem; line-height: 1.65; color: #d4d4d8; }
    .markdown-body ul li::before {
      content: "•";
      position: absolute;
      left: 0.3rem;
      color: #71717a;
      font-weight: bold;
    }

    .markdown-body ol { list-style-type: decimal; margin-left: 1.35rem; margin-top: 0.35rem; margin-bottom: 0.85rem; }
    .markdown-body ol li { margin-bottom: 0.35rem; line-height: 1.65; color: #d4d4d8; }

    .markdown-body h1, .markdown-body h2, .markdown-body h3 { 
      font-weight: 600; margin-top: 1.25rem; margin-bottom: 0.5rem; letter-spacing: -0.015em; color: #ffffff; 
    }
    .markdown-body h2 { font-size: 1.15rem; border-bottom: 1px solid rgba(255,255,255,0.06); padding-bottom: 0.35rem; }
    .markdown-body h3 { font-size: 1.05rem; }
    .markdown-body strong { font-weight: 600; color: #ffffff; }
    .markdown-body code { 
      padding: 0.15rem 0.4rem; border-radius: 0.375rem; font-family: 'JetBrains Mono', monospace; font-size: 0.84em; 
    /* Table Styling */
    .markdown-body table {
      width: 100%;
      border-collapse: collapse;
      margin: 1rem 0;
      font-size: 0.875rem;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 0.75rem;
      overflow: hidden;
    }
    .markdown-body th {
      background: rgba(255, 255, 255, 0.05);
      padding: 0.6rem 0.85rem;
      text-align: left;
      font-weight: 600;
      color: #f4f4f5;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }
    .markdown-body td {
      padding: 0.55rem 0.85rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      color: #d4d4d8;
    }
    .markdown-body tr:last-child td {
      border-bottom: none;
    }

    /* Inline Streaming Cursor (Zero floating/orphan pipes) */
    .streaming-cursor {
      display: inline-block;
      width: 2px;
      height: 1.05em;
      background-color: #f4f4f5;
      margin-left: 2px;
      vertical-align: -0.15em;
      animation: cursorBlink 0.8s infinite;
      border-radius: 1px;
    }
    @keyframes cursorBlink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    /* KaTeX Math Styling */
    .katex { font-size: 1.08em; line-height: 1.2; color: #ffffff; }
    .katex-display { 
      margin: 0.85rem 0; overflow-x: auto; overflow-y: hidden; 
      padding: 0.75rem 1rem; border-radius: 0.75rem; text-align: center; 
      background: #111114; border: 1px solid rgba(255, 255, 255, 0.07);
    }

    /* MCQ Option Card (High-visibility Interactive Borders) */
    .mcq-opt {
      transition: all 0.18s cubic-bezier(0.16, 1, 0.3, 1);
      background-color: #121216;
      border: 1.5px solid rgba(255, 255, 255, 0.09);
      color: #e4e4e7;
    }
    .mcq-opt:hover {
      border-color: rgba(255, 255, 255, 0.22);
      background-color: #18181e;
      transform: translateY(-1px);
    }
    .mcq-opt.correct {
      border: 2px solid #10b981 !important;
      background-color: rgba(16, 185, 129, 0.14) !important;
      box-shadow: 0 0 16px rgba(16, 185, 129, 0.22) !important;
    }
    .mcq-opt.correct .opt-letter {
      background-color: #10b981 !important;
      color: #ffffff !important;
      border-color: #10b981 !important;
      font-weight: 700 !important;
    }
    .mcq-opt.correct .opt-text {
      color: #34d399 !important;
      font-weight: 600 !important;
    }
    .mcq-opt.wrong {
      border: 2px solid #ef4444 !important;
      background-color: rgba(239, 68, 68, 0.14) !important;
      box-shadow: 0 0 16px rgba(239, 68, 68, 0.22) !important;
    }
    .mcq-opt.wrong .opt-letter {
      background-color: #ef4444 !important;
      color: #ffffff !important;
      border-color: #ef4444 !important;
      font-weight: 700 !important;
    }
    .mcq-opt.wrong .opt-text {
      color: #fb7185 !important;
      font-weight: 600 !important;
    }

    /* Hero & Chat Transitions */
    #heroView {
      transition: opacity 0.28s cubic-bezier(0.16, 1, 0.3, 1), transform 0.28s cubic-bezier(0.16, 1, 0.3, 1);

    }

    #chatView {

    }
    #chatView.hidden-state {
      opacity: 0;
      transform: translateY(10px);
      display: none;
    }
  </style>

  <script>
    let isProcessing = false;
    let isChatActive = false;
    let conversationHistory = [];
    let recentChats = JSON.parse(localStorage.getItem('prime_recent_chats') || '[]');

    function toBnDigits(num) {
      if (num === undefined || num === null) return "";
      const bn = ["০", "১", "২", "৩", "৪", "৫", "৬", "৭", "৮", "৯"];
      return String(num).replace(/[0-9]/g, d => bn[d]);
    }

    // Exact Reference Generator: Builds intelligent academic thought tree
    function generateThoughtTreeData(tool, args, result) {
      let mainTitle = "বোর্ড ডেটাবেস ও অ্যানালিটিক্স যাচাই";
      let intentReasoning = "শিক্ষার্থীর প্রশ্নের প্রাসঙ্গিকতা ও একাডেমিক প্রয়োজনীয়তা বিশ্লেষণ করা হয়েছে।";
      let toolLabel = "বোর্ড প্রশ্নব্যাংক অনুসন্ধান";
      let countTag = "যাচাই সম্পন্ন";

    // Toggle entire Thought Tree
    function toggleThoughtTree(treeId, triggerEl) {
      const tree = document.getElementById(treeId);
      if (!tree) return;
      const chevron = triggerEl.querySelector('.thought-chevron');
      if (tree.classList.contains('collapsed')) {
        tree.classList.remove('collapsed');
        if (chevron) chevron.style.transform = 'rotate(0deg)';
      } else {
        tree.classList.add('collapsed');
        if (chevron) chevron.style.transform = 'rotate(-90deg)';
      }
    }

    // Toggle individual Think sub-step
    function toggleSubStep(triggerEl) {
      const step = triggerEl.closest('.thought-step');
      if (!step) return;
      const content = step.querySelector('.thought-sub-content');
      const chevron = triggerEl.querySelector('svg:last-child');
      if (!content) return;
      if (content.classList.contains('collapsed')) {
        content.classList.remove('collapsed');
        if (chevron) chevron.style.transform = 'rotate(0deg)';
      } else {
        content.classList.add('collapsed');
        if (chevron) chevron.style.transform = 'rotate(-90deg)';
      }
    }

    // Smooth Typewriter Stream for Inner Thoughts (Mind-like progressive streaming with micro-cursor)
    async function streamThoughtText(element, text, speedMs = 12) {
      if (!element || !text) return;
      const words = text.split(" ");
      element.innerHTML = '<span class="inline-block w-1 h-3 bg-zinc-400/80 animate-pulse ml-0.5 align-middle rounded-full"></span>';
      let current = "";
      for (let i = 0; i < words.length; i++) {
        current += (i === 0 ? "" : " ") + escapeHtml(words[i]);
        element.innerHTML = current + '<span class="inline-block w-1 h-3 bg-zinc-400/80 animate-pulse ml-0.5 align-middle rounded-full"></span>';
        scrollToBottom();
        if (speedMs > 0) {
          await new Promise(r => setTimeout(r, speedMs));
        }
      }
      element.innerHTML = current;
    }

    function renderRecentChats() {
      const container = document.getElementById('recentChatsList');
      if (!container) return;
      if (recentChats.length === 0) {
        container.innerHTML = '<div class="px-2.5 py-2 text-zinc-500 text-[11px] italic">কোনো পূর্ববর্তী আলোচনা নেই</div>';
        return;
      }
      container.innerHTML = recentChats.slice(-8).reverse().map((t) => `
        <button onclick="submitPrompt('${escapeHtml(t).replace(/'/g, "\\'")}'); if(window.innerWidth < 768) toggleSidebar();" 
          class="w-full text-left px-2 py-1.5 rounded-lg hover:bg-white/[0.04] text-zinc-300 truncate text-[11px] transition flex items-center gap-2">
          <svg class="w-3 h-3 text-zinc-500 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"/></svg>
          <span class="truncate">${escapeHtml(t)}</span>
        </button>
      `).join('');
    }

    function addRecentChat(title) {
      if (!title || recentChats.includes(title)) return;
      recentChats.push(title);
      if (recentChats.length > 15) recentChats.shift();
      localStorage.setItem('prime_recent_chats', JSON.stringify(recentChats));
      renderRecentChats();
    }

    function handleHeroSubmit(e) {

      const inp = document.getElementById('heroInput');

      if (!txt || isProcessing) return;
      activateChatView();
      addRecentChat(txt);
      sendMessage(txt);

    }

    function handleDockedSubmit(e) {
      e.preventDefault();
      const inp = document.getElementById('dockedInput');

    function submitPrompt(text) {
      if (isProcessing) return;
      activateChatView();
      addRecentChat(text);
      sendMessage(text);
    }

    function normLetter(ch) {
      if (!ch) return '';
      const c = ch.trim().toLowerCase();
      if (c === 'a' || c === 'ক') return 'ক';
      if (c === 'b' || c === 'খ') return 'খ';
      if (c === 'c' || c === 'গ') return 'গ';
      if (c === 'd' || c === 'ঘ') return 'ঘ';
      return c;
    }

    // Interactive MCQ Selection (High-contrast Red/Green Feedback)
    function handleOptionClick(btn, letter) {
      if (isProcessing) return;
      const cardWrapper = btn.closest('.mcq-wrapper');
      let correct = cardWrapper ? cardWrapper.getAttribute('data-correct') : null;
      if (correct) correct = correct.trim();

      const chosenNorm = normLetter(letter);
      const correctNorm = normLetter(correct);
      const isCorrect = Boolean(correctNorm && chosenNorm === correctNorm);

      const grid = btn.closest('.mcq-options-grid');
      if (grid) {
        grid.querySelectorAll('.mcq-opt').forEach(opt => {
          opt.classList.add('pointer-events-none');
          const optL = (opt.getAttribute('data-letter') || '').trim();
          const optLNorm = normLetter(optL);
          const badge = opt.querySelector('.opt-badge');

          if (correctNorm && optLNorm === correctNorm) {
            opt.classList.add('correct');
            if (badge) {
              badge.innerHTML = '<span class="text-emerald-400 text-sm font-bold">✓</span>';
              badge.classList.remove('hidden');
            }
          } else if (optLNorm === chosenNorm && !isCorrect) {
            opt.classList.add('wrong');
            if (badge) {
              badge.innerHTML = '<span class="text-rose-400 text-sm font-bold">✕</span>';
              badge.classList.remove('hidden');
            }
          } else {
            opt.classList.add('opacity-35');
          }
        });
      }

      // No redundant banner inside the card — the conversational tutor below gives the full explanation!
      const replyMsg = `আমার উত্তর (${letter})`;
      sendMessage(replyMsg);
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    // Content Formatter (Markdown + KaTeX Math + Robust Multi-MCQ Extraction)
    function renderFormattedContent(rawText) {
      if (!rawText) return "";

      let clean = rawText;

      // 1. Extract Board Reference Tag (cleanly removes tag from text without leaking placeholder)
      let boardTagsHtml = "";
      clean = clean.replace(/\[(?:বোর্ড|Board):?\s*([^\]]+)\]/gi, (match, tag) => {
        const tags = tag.split(',').map(x => x.trim()).filter(Boolean);
        boardTagsHtml = tags.map(b => `<span class="px-2 py-0.5 rounded text-[10px] font-mono bg-white/[0.06] text-zinc-300 border border-white/[0.08]">${escapeHtml(b)}</span>`).join(' ');
        return '';
      });
      clean = clean.replace(/%%%BOARD_CONTAINER%%%/gi, '');

      // 2. Extract detected answer tag
      let detectedAns = null;
      clean = clean.replace(/\[ans:\s*([ক-ঘa-dA-D])\]/gi, (m, g) => {
        detectedAns = g;
        return '';
      });

      // 3. Protect KaTeX Display Math ($$...$$ and \[...\])
      const displayMath = [];
      clean = clean.replace(/(?:\$\$([\s\S]*?)\$\$|\\\[([\s\S]*?)\\\])/g, (m, c1, c2) => {
        const code = c1 !== undefined ? c1 : c2;
        displayMath.push(code);
        return '%%%MATH_D_' + (displayMath.length - 1) + '%%%';
      });

      // 4. Protect KaTeX Inline Math ($...$, \(...\), and parenthesized/standalone LaTeX formulas like (\mathrm{pH}=7))
      const inlineMath = [];
      clean = clean.replace(/(?:(?<!\\)\$([^\$\n]+?)(?<!\\)\$|\\\(([^\\\n]*?)\\\)|\(([^()\n]*?\\[a-zA-Z]+[^()\n]*?)\)|(\\[a-zA-Z]+(?:\{[^\}\n]*\})*(?:[\s_^\-\+*\/=<>]+[a-zA-Z0-9\(\)\{\}\\]+)*))/g, (m, c1, c2, c3, c4) => {
        const code = c1 !== undefined ? c1 : (c2 !== undefined ? c2 : (c3 !== undefined ? c3 : c4));
        inlineMath.push(code);
        return '%%%MATH_I_' + (inlineMath.length - 1) + '%%%';
      });

      // 5. Robust Raw-Text MCQ Option Extraction (Handles blank lines, bullets, bolding, multi-MCQs)
      const singleOptionLineRegex = /^[ \t]*(?:[-*+]\s+)?(?:\*{1,2})?(?:\(([ক-ঘa-dA-D])\)|([ক-ঘa-dA-D])[\.\)])(?:\*{1,2})?[ \t]+([^\r\n]+)/;

      const lines = clean.split(/\r?\n/);
      const clusters = [];
      let currentCluster = null;

      for (let i = 0; i < lines.length; i++) {
        const line = lines[i];
        const match = line.match(singleOptionLineRegex);

        if (match) {
          const letter = match[1] || match[2];
          const text = match[3].replace(/\*{2,4}$/, '').trim();
          if (!currentCluster) {
            currentCluster = { startIndex: i, endIndex: i, items: [] };
          }
          currentCluster.endIndex = i;
          currentCluster.items.push({ letter, text, lineIdx: i });
        } else if (line.trim() === "") {
          // Keep cluster active across blank lines between options
        } else {
          if (currentCluster) {
            if (currentCluster.items.length >= 2) {
              clusters.push(currentCluster);
            }
            currentCluster = null;
          }
        }
      }
      if (currentCluster && currentCluster.items.length >= 2) {
        clusters.push(currentCluster);
      }

      const cards = [];
      for (let c = clusters.length - 1; c >= 0; c--) {
        const cluster = clusters[c];
        const firstLineIdx = cluster.startIndex;
        let lastLineIdx = cluster.endIndex;

        let explanationLines = [];
        let foundAnsInExp = null;
        let scanIdx = lastLineIdx + 1;

        while (scanIdx < lines.length && lines[scanIdx].trim() === "") {
          scanIdx++;
        }

        // Cleanly strip any trailing answer/explanation lines to prevent spoiler leaks
        while (scanIdx < lines.length && /^\s*(?:\*{0,2}(?:সঠিক উত্তর|Answer|Ans|ব্যাখ্যা|Explanation):)/i.test(lines[scanIdx])) {
          explanationLines.push(lines[scanIdx]);
          lastLineIdx = scanIdx;
          scanIdx++;

          let consecutiveBlanks = 0;
          while (scanIdx < lines.length) {
            const expLine = lines[scanIdx];
            if (expLine.trim() === "") {
              consecutiveBlanks++;
              if (consecutiveBlanks >= 2) break;
              explanationLines.push(expLine);
            } else {
              if (/^(?:#{1,4}\s+|MCQ:|\d+[\.\)]|প্রশ্ন\s*[:\d])/i.test(expLine.trim())) {
                break;
              }
              if (/^\s*(?:\*{0,2}(?:সঠিক উত্তর|Answer|Ans|ব্যাখ্যা|Explanation):)/i.test(expLine)) {
                break;
              }
              consecutiveBlanks = 0;
              explanationLines.push(expLine);
            }
            lastLineIdx = scanIdx;
            scanIdx++;
          }
        }

        const explanationText = explanationLines.join('\n').trim();
        if (explanationText) {
          const expAnsM = explanationText.match(/(?:সঠিক উত্তর|Answer|Ans)[:\s]*\(([ক-ঘa-dA-D])\)|(?:সঠিক উত্তর|Answer|Ans)[:\s]*([ক-ঘa-dA-D])/i);
          if (expAnsM) {
            foundAnsInExp = expAnsM[1] || expAnsM[2];
          }
        }

        const targetAns = detectedAns || foundAnsInExp || '';

        const optionsHtml = cluster.items.map(it => `
          <button type="button" 
            class="mcq-opt flex items-center justify-between gap-2.5 p-3 rounded-xl text-left w-full cursor-pointer shadow-sm relative overflow-hidden"
            data-letter="${it.letter}"
            onclick="handleOptionClick(this, '${it.letter}')">
            <div class="flex items-center gap-2.5 min-w-0">
              <span class="opt-letter w-6 h-6 rounded-md bg-white/[0.06] text-zinc-300 font-mono text-xs flex items-center justify-center font-semibold shrink-0 border border-white/[0.08] transition-all">
                ${it.letter}
              </span>
              <span class="opt-text text-xs sm:text-sm text-zinc-200 transition-colors truncate">${it.text}</span>
            </div>
            <span class="opt-badge hidden text-xs font-bold shrink-0"></span>
          </button>
        `).join('');

        const placeholder = `%%%MCQ_PLACEHOLDER_${c}%%%`;
        const cardHtml = `
          <div class="mcq-wrapper my-3 bg-app-surface border border-white/[0.08] rounded-2xl p-3.5 space-y-3 shadow-md" data-correct="${targetAns}">
            ${boardTagsHtml ? `<div class="flex flex-wrap gap-1.5 pb-2 border-b border-white/[0.06]">${boardTagsHtml}</div>` : ''}
            <div class="mcq-options-grid grid grid-cols-1 sm:grid-cols-2 gap-2">
              ${optionsHtml}
            </div>
            <div class="flex items-center justify-between pt-1 border-t border-white/[0.04] text-[11px] text-zinc-500 font-mono">
              <span>যেকোনো একটি অপশন নির্বাচন করো</span>
            </div>
          </div>
        `;

        lines.splice(firstLineIdx, (lastLineIdx - firstLineIdx + 1), placeholder);
        cards.push({ placeholder, cardHtml });
      }

      clean = lines.join('\n');

      // 6. Parse Markdown
      let html = "";
      try {
        html = marked.parse(clean);
      } catch (e) {
        html = escapeHtml(clean);
      }

      // 7. Inject MCQ Cards
      for (const card of cards) {
        const reg = new RegExp(`<p>\\s*${card.placeholder}\\s*<\\/p>|${card.placeholder}`, 'g');
        html = html.replace(reg, card.cardHtml);
      }

      // 8. Restore KaTeX Display Math
      html = html.replace(/%%%MATH_D_(\d+)%%%/g, (m, idx) => {
        const code = displayMath[parseInt(idx, 10)];
        if (!code) return m;
        if (window.katex) {
          try {
            return window.katex.renderToString(code.trim(), { displayMode: true, throwOnError: false });
          } catch(e) {}
        }
        return `<div class="katex-display">${escapeHtml(code)}</div>`;
      });

      // 9. Restore KaTeX Inline Math
      html = html.replace(/%%%MATH_I_(\d+)%%%/g, (m, idx) => {
        const code = inlineMath[parseInt(idx, 10)];
        if (!code) return m;
        if (window.katex) {
          try {
            return window.katex.renderToString(code.trim(), { displayMode: false, throwOnError: false });
          } catch(e) {}
        }
        return `<span class="katex-inline">${escapeHtml(code)}</span>`;
      });

      html = html.replace(/<p>\s*\[ans:[^\]]*\]\s*<\/p>|\[ans:[^\]]*\]/gi, '');
      html = html.replace(/<p>\s*<\/p>/g, '');
      return html;
    }

    function renderFormattedContentWithCursor(rawText, isStreaming = false) {
      if (!rawText) return "";
      
      // Clean up empty trailing table pipes
      let cleanText = rawText.replace(/\|\s*\|\s*$/gm, '|');
      let html = renderFormattedContent(cleanText);
      if (!isStreaming) return html;

      const cursorHtml = '<span class="streaming-cursor"></span>';
      
      // Attach cursor before the last closing text tag (p, li, td, h1-h6) so it stays inline with text
      const match = html.match(/<\/(?:p|li|td|h[1-6]|span)>(?![\s\S]*<\/(?:p|li|td|h[1-6]|span)>)/i);
      if (match && match.index !== undefined) {
        return html.slice(0, match.index) + cursorHtml + html.slice(match.index);
      }
      return html + cursorHtml;
    }

    // Send Message Async Stream Loop
    async function sendMessage(text) {
      const area = document.getElementById('messagesArea');

      // 1. User Message (Clean, Natural, ChatGPT-style)
      const userHtml = `
        <div class="flex justify-end my-1">
          <div class="bg-[#27272e] text-zinc-100 px-4 py-2.5 rounded-2xl rounded-tr-sm max-w-[85%] sm:max-w-[72%] text-sm leading-relaxed border border-white/[0.06] shadow-sm font-normal tracking-wide">
            ${escapeHtml(text)}
          </div>
        </div>
      `;
      area.insertAdjacentHTML('beforeend', userHtml);
      scrollToBottom();

      const msgId = 'msg_' + Date.now();
      const contentId = 'content_' + msgId;
      const statusId = 'status_' + msgId;
      const labelId = 'statusLabel_' + msgId;
      const toolContainerId = 'tool_' + msgId;
      const treeTitleId = 'treeTitle_' + msgId;
      const treeId = 'tree_' + msgId;

      // 2. Assistant Message Shell (Clean Full-Width, Collapsible Thought Tree Toggle)
      const assistantHtml = `
        <div id="${msgId}" class="w-full space-y-2 py-1 select-text">
          
          <!-- Exact Reference 1: Lightbulb Thinking Animation with Text Shimmer Beam -->
          <div id="${statusId}" class="flex items-center gap-2 text-sm text-zinc-400 select-none py-1 transition-all">
            <svg class="w-4 h-4 text-zinc-400 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 2a7 7 0 00-7 7c0 2.38 1.19 4.47 3 5.74V17a2 2 0 002 2h4a2 2 0 002-2v-2.26c1.81-1.27 3-3.36 3-5.74a7 7 0 00-7-7zM9 21h6"/>
            </svg>
            <span id="${labelId}" class="thinking-shimmer font-medium tracking-wide">Thinking...</span>
          </div>

          <!-- Exact Reference 2: Dotted Thought Tree (Interactive Collapsible Toggle) -->
          <div id="${toolContainerId}" class="hidden select-none py-0.5">
            <div class="thought-header flex items-center gap-2 text-xs sm:text-[13px] text-zinc-300 hover:text-white cursor-pointer py-1 transition group w-fit" onclick="toggleThoughtTree('${treeId}', this)">
              <svg class="w-4 h-4 text-zinc-400 group-hover:text-zinc-200 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
              </svg>
              <span id="${treeTitleId}" class="font-medium tracking-tight"></span>
              <svg class="thought-chevron w-3.5 h-3.5 text-zinc-500 group-hover:text-zinc-300 transition-transform duration-200 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/>
              </svg>
            </div>

            <!-- Dotted Connector Thread -->
            <div id="${treeId}" class="thought-tree pl-2.5 ml-2 border-l border-dashed border-zinc-700/80 my-2 space-y-2 text-xs text-zinc-400">
              <!-- Dynamically populated steps -->
            </div>
          </div>

          <!-- Content Container (Full Width Editorial Flow) -->
          <div id="${contentId}" class="markdown-body text-[14px] sm:text-[15px] leading-relaxed hidden min-h-[20px]"></div>

        </div>
      `;
      area.insertAdjacentHTML('beforeend', assistantHtml);
      scrollToBottom();

      isProcessing = true;
      const sendBtn = document.getElementById('sendBtn');
      if (sendBtn) {
        sendBtn.disabled = true;
        sendBtn.classList.add('opacity-40');
      }

      let streamContent = "";
      let hasTool = false;
      let toolStartEvt = null;
      let toolDoneEvt = null;
      let thoughtPipelineDone = false;

      async function streamWords(el, text, delayMs = 14) {
        if (!el || !text) return;
        const words = text.trim().split(/\s+/);
        let current = "";
        for (let i = 0; i < words.length; i++) {
          current += (i === 0 ? "" : " ") + escapeHtml(words[i]);
          el.innerHTML = current + '<span class="inline-block w-1 h-3 bg-zinc-400/80 animate-pulse ml-0.5 align-middle rounded-full"></span>';
          scrollToBottom();
          if (delayMs > 0) {
            await new Promise(r => setTimeout(r, delayMs));
          }
        }
        el.innerHTML = current;
      }

      async function runThoughtSequence(startEvt) {
        hasTool = true;

        // Permanently hide the top status header — the Thought Tree IS the thinking block!
        const statusEl = document.getElementById(statusId);
        if (statusEl) {
          statusEl.classList.add('hidden');
          statusEl.style.display = 'none';
        }

        const toolContainer = document.getElementById(toolContainerId);
        const titleEl = document.getElementById(treeTitleId);
        const treeEl = document.getElementById(treeId);

        const startData = generateThoughtTreeData(startEvt.tool, startEvt.args, null);
        if (titleEl) titleEl.innerText = startData.mainTitle;

        // Step 1: Render ONLY Think step first (Step 2 and Step 3 are not visible yet!)
        if (treeEl) {
          treeEl.innerHTML = `
            <div class="thought-step" id="step1_${msgId}">
              <div class="flex items-center gap-1.5 text-zinc-400 hover:text-zinc-200 cursor-pointer font-medium" onclick="toggleSubStep(this)">
                <span class="text-zinc-500 font-bold">•</span>
                <span>Think</span>
                <svg class="w-3 h-3 text-zinc-500 transition-transform" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/></svg>
              </div>
              <div class="thought-sub-content pl-3 pt-1 text-[11.5px] text-zinc-400 leading-relaxed font-sans" id="step1Text_${msgId}"></div>
            </div>
          `;
        }
        if (toolContainer) toolContainer.classList.remove('hidden');
        scrollToBottom();

        // 1. Stream Step 1 reasoning word by word
        const step1El = document.getElementById(`step1Text_${msgId}`);
        if (step1El) {
          await streamWords(step1El, startData.intentReasoning, 14);
        }

        // 2. Introduce Step 2 (Database Tool Execution with active pulse)
        if (treeEl) {
          const step2Html = `
            <div class="thought-step flex items-center gap-2 text-zinc-300 font-medium transition-all" id="step2_${msgId}">
              <svg class="w-3.5 h-3.5 text-zinc-400 shrink-0 animate-pulse" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
              <span>${escapeHtml(startData.toolLabel)}</span>
              <span class="text-[11px] font-mono text-zinc-400 bg-white/[0.06] px-1.5 py-0.5 rounded border border-white/[0.08] animate-pulse" id="step2Badge_${msgId}">অনুসন্ধান চলছে...</span>
            </div>
          `;
          treeEl.insertAdjacentHTML('beforeend', step2Html);
          scrollToBottom();
        }

        // Realistic active search execution pulse (~320ms)
        await new Promise(r => setTimeout(r, 320));

        // Resolve Step 2 with verified result
        const doneData = generateThoughtTreeData(
          toolDoneEvt?.tool || startEvt.tool,
          toolDoneEvt?.args || startEvt.args,
          toolDoneEvt?.result
        );

        const step2Badge = document.getElementById(`step2Badge_${msgId}`);
        if (step2Badge) {
          step2Badge.className = "text-[11px] font-mono text-emerald-400 bg-emerald-500/10 px-1.5 py-0.5 rounded border border-emerald-500/20";
          step2Badge.innerText = doneData.countTag || "সম্পন্ন";
        }
        const step2El = document.getElementById(`step2_${msgId}`);
        if (step2El) {
          const icon = step2El.querySelector('svg');
          if (icon) icon.classList.remove('animate-pulse');
        }

        // 3. Introduce Step 3 (Think - Synthesis)
        if (treeEl) {
          const step3Html = `
            <div class="thought-step transition-all" id="step3_${msgId}">
              <div class="flex items-center gap-1.5 text-zinc-400 hover:text-zinc-200 cursor-pointer font-medium" onclick="toggleSubStep(this)">
                <span class="text-zinc-500 font-bold">•</span>
                <span>Think</span>
                <svg class="w-3 h-3 text-zinc-500 transition-transform" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/></svg>
              </div>
              <div class="thought-sub-content pl-3 pt-1 text-[11.5px] text-zinc-400 leading-relaxed font-sans" id="step3Text_${msgId}"></div>
            </div>
          `;
          treeEl.insertAdjacentHTML('beforeend', step3Html);
          scrollToBottom();
        }

        const step3El = document.getElementById(`step3Text_${msgId}`);
        if (step3El) {
          await streamWords(step3El, doneData.synthesisReasoning, 14);
        }

        // 4. Mark Thought Sequence Completed!
        thoughtPipelineDone = true;

        // Release streamed response content if already arrived and buffered
        const contentEl = document.getElementById(contentId);
        if (contentEl && streamContent) {
          contentEl.classList.remove('hidden');
          contentEl.innerHTML = renderFormattedContentWithCursor(streamContent, true);
          scrollToBottom();
        }
      }

      try {
        const res = await fetch('/api/chat/stream', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text, history: conversationHistory })
        });

        if (!res.ok) throw new Error('HTTP ' + res.status);

        const reader = res.body.getReader();
        const decoder = new TextDecoder('utf-8');
        let buffer = "";

        while (true) {
          const { done, value } = await reader.read();
          if (done) {
            if (buffer.trim()) handleSseChunk(buffer);
            break;
          }
          buffer += decoder.decode(value, { stream: true });
          const parts = buffer.split("\n\n");
          buffer = parts.pop();
          for (const p of parts) handleSseChunk(p);
        }

        function handleSseChunk(chunk) {
          const lines = chunk.split("\n");
          for (const line of lines) {
            const trimmed = line.trim();
            if (!trimmed.startsWith("data:")) continue;
            const raw = trimmed.replace(/^data:\s*/, "").trim();
            if (!raw) continue;

            try {
              const data = JSON.parse(raw);

              // 1. Tool Start -> Orchestrate Step-by-Step Thought Sequence!
              if (data.type === "tool_start") {
                toolStartEvt = data;
                runThoughtSequence(data);
              }

              // 2. Tool Done -> Cache result for Step 2 resolution
              if (data.type === "tool_done") {
                toolDoneEvt = data;
              }

              // 2b. Generating Start -> Keep top status hidden if tool is running
              if (data.type === "generating_start") {
                if (!hasTool) {
                  const label = document.getElementById(labelId);
                  if (label) {
                    label.className = "thinking-shimmer font-medium tracking-wide";
                    label.innerText = "Writing response...";
                  }
                }
              }

              // 3. Content Delta (Instant Real-time Streaming)
              if (data.type === "content_delta" && data.delta) {
                streamContent += data.delta;

                if (!hasTool) {
                  // Direct conversational answers (no tools) stream immediately!
                  const statusEl = document.getElementById(statusId);
                  if (statusEl) statusEl.classList.add('hidden');

                  const contentEl = document.getElementById(contentId);
                  if (contentEl) {
                    contentEl.classList.remove('hidden');
                    contentEl.innerHTML = renderFormattedContentWithCursor(streamContent, true);
                  }
                  scrollToBottom();
                } else if (thoughtPipelineDone) {
                  // Thought sequence completed -> stream live tokens directly!
                  const contentEl = document.getElementById(contentId);
                  if (contentEl) {
                    contentEl.classList.remove('hidden');
                    contentEl.innerHTML = renderFormattedContentWithCursor(streamContent, true);
                  }
                  scrollToBottom();
                }
              }

              // 4. Done Event
              if (data.type === "done") {
                const final = data.content || streamContent;
                thoughtPipelineDone = true;

                const statusEl = document.getElementById(statusId);
                if (statusEl) statusEl.classList.add('hidden');

                const contentEl = document.getElementById(contentId);
                if (contentEl) {
                  contentEl.classList.remove('hidden');
                  if (final) contentEl.innerHTML = renderFormattedContentWithCursor(final, false);
                }
                conversationHistory.push({ role: "user", content: text });
                conversationHistory.push({ role: "assistant", content: final });
                scrollToBottom();
              }

            } catch(e) {}
          }
        }

      } catch (err) {
        const contentEl = document.getElementById(contentId);
        const statusEl = document.getElementById(statusId);
        if (statusEl) statusEl.classList.add('hidden');
        if (contentEl) {
          contentEl.classList.remove('hidden');
          contentEl.innerHTML = `<span class="text-rose-400 font-mono text-xs">ত্রুটি: ${escapeHtml(err.message)}</span>`;
        }
      } finally {
        isProcessing = false;
        if (sendBtn) {
          sendBtn.disabled = false;
          sendBtn.classList.remove('opacity-40');
        }
      }
    }

    function scrollToBottom() {
      const el = document.getElementById('contentScrollArea');
      if (el) el.scrollTop = el.scrollHeight;
    }

    // Auto-resize docked textarea
    const dockedInp = document.getElementById('dockedInput');
    if (dockedInp) {
      dockedInp.addEventListener('input', function() {
        this.style.height = 'auto';
        this.style.height = Math.min(this.scrollHeight, 120) + 'px';
      });
    }

    // Keyboard Shortcuts (Ctrl+K = New Chat)
    document.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
        e.preventDefault();
        resetToHome();
      }
    });

    renderRecentChats();
  </script>
</body>
