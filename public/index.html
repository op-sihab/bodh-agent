<!DOCTYPE html>
<html lang="bn" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BODH (বোধ) — Autonomous Academic Intelligence</title>
  <link rel="icon" type="image/png" href="/assets/favicon.png">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            app: {
              bg: '#08080a',
              sidebar: '#0c0c0f',
              surface: '#111115',
              surfaceElevated: '#17171d',
              border: '#ffffff12',
              borderHover: '#ffffff24',
              text: '#f4f4f5',
              muted: '#8b8b94'
            }
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', '"Anek Bangla"', '"Hind Siliguri"', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'SF Mono', 'Menlo', 'monospace']
          }
        }
      }
    }
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anek+Bangla:wght@400;500;600;700;800&family=Hind+Siliguri:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="/assets/katex.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <script src="/assets/katex.min.js"></script>
  <script>
    if (!window.katex) {
      document.write('<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"><\\/script>');
    }
  </script>

  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Plus Jakarta Sans', 'Anek Bangla', 'Hind Siliguri', -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
      background-color: #08080a;
      color: #f4f4f5;
    }

    /* Subtle ambient mesh glow in background */
    .ambient-glow {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(circle at 50% 12%, rgba(255, 255, 255, 0.035) 0%, transparent 60%);
      z-index: 0;
    }

    /* Minimalist Scrollbar */
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.12); border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.22); }

    .chatgpt-scroll::-webkit-scrollbar { width: 5px; }
    .chatgpt-scroll::-webkit-scrollbar-track { background: transparent; }
    .chatgpt-scroll::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.16); border-radius: 9999px; }
    .chatgpt-scroll::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.28); }

    /* Exact Reference: Lightbulb Thinking Shimmer Beam */
    @keyframes thinkingBeam {
      0% { background-position: -150% 0; }
      100% { background-position: 150% 0; }
    }
    .thinking-shimmer {
      background: linear-gradient(
        90deg,
        #71717a 0%,
        #71717a 20%,
        #ffffff 50%,
        #71717a 80%,
        #71717a 100%
      );
      background-size: 200% 100%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: thinkingBeam 2.4s infinite ease-in-out;
      display: inline-block;
      vertical-align: middle;
    }

    /* Exact Reference: Dotted Thought Tree */
    .thought-tree {
      transition: max-height 0.28s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.2s ease, margin 0.2s ease;
      overflow: hidden;
    }
    .thought-tree.collapsed {
      max-height: 0px !important;
      opacity: 0 !important;
      margin-top: 0px !important;
      margin-bottom: 0px !important;
      border-left-color: transparent !important;
    }
    .thought-sub-content {
      transition: max-height 0.22s ease, opacity 0.18s ease;
      overflow: hidden;
    }
    .thought-sub-content.collapsed {
      max-height: 0px !important;
      opacity: 0 !important;
      padding-top: 0px !important;
      padding-bottom: 0px !important;
    }

    /* Markdown Styling */
    .markdown-body p { margin-bottom: 0.85rem; line-height: 1.75; font-size: 0.9375rem; color: #d4d4d8; }
    .markdown-body p:last-child { margin-bottom: 0; }
    
    .markdown-body ul { list-style-type: none; margin-left: 0; padding-left: 0; margin-top: 0.35rem; margin-bottom: 0.85rem; }
    .markdown-body ul li { position: relative; padding-left: 1.25rem; margin-bottom: 0.4rem; line-height: 1.65; color: #d4d4d8; }
    .markdown-body ul li::before {
      content: "•";
      position: absolute;
      left: 0.3rem;
      color: #71717a;
      font-weight: bold;
    }

    .markdown-body ol { list-style-type: decimal; margin-left: 1.35rem; margin-top: 0.35rem; margin-bottom: 0.85rem; }
    .markdown-body ol li { margin-bottom: 0.35rem; line-height: 1.65; color: #d4d4d8; }

    .markdown-body h1, .markdown-body h2, .markdown-body h3 { 
      font-weight: 600; margin-top: 1.25rem; margin-bottom: 0.5rem; letter-spacing: -0.015em; color: #ffffff; 
    }
    .markdown-body h2 { font-size: 1.15rem; border-bottom: 1px solid rgba(255,255,255,0.06); padding-bottom: 0.35rem; }
    .markdown-body h3 { font-size: 1.05rem; }
    .markdown-body strong { font-weight: 600; color: #ffffff; }
    .markdown-body code { 
      padding: 0.15rem 0.4rem; border-radius: 0.375rem; font-family: 'JetBrains Mono', monospace; font-size: 0.84em; 
    /* Table Styling */
    .markdown-body table {
      width: 100%;
      border-collapse: collapse;
      margin: 1rem 0;
      font-size: 0.875rem;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 0.75rem;
      overflow: hidden;
    }
    .markdown-body th {
      background: rgba(255, 255, 255, 0.05);
      padding: 0.6rem 0.85rem;
      text-align: left;
      font-weight: 600;
      color: #f4f4f5;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }
    .markdown-body td {
      padding: 0.55rem 0.85rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      color: #d4d4d8;
    }
    .markdown-body tr:last-child td {
      border-bottom: none;
    }

    /* Inline Streaming Cursor (Zero floating/orphan pipes) */
    .streaming-cursor {
      display: inline-block;
      width: 2px;
      height: 1.05em;
      background-color: #f4f4f5;
      margin-left: 2px;
      vertical-align: -0.15em;
      animation: cursorBlink 0.8s infinite;
      border-radius: 1px;
    }
    @keyframes cursorBlink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    /* KaTeX Math Styling */
    .katex { font-size: 1.08em; line-height: 1.2; color: #ffffff; }
    .katex-display { 
      margin: 0.85rem 0; overflow-x: auto; overflow-y: hidden; 
      padding: 0.75rem 1rem; border-radius: 0.75rem; text-align: center; 
      background: #111114; border: 1px solid rgba(255, 255, 255, 0.07);
    }

    /* MCQ Option Card (High-visibility Interactive Borders) */
    .mcq-opt {
      transition: all 0.18s cubic-bezier(0.16, 1, 0.3, 1);
      background-color: #121216;
      border: 1.5px solid rgba(255, 255, 255, 0.09);
      color: #e4e4e7;
    }
    .mcq-opt:hover {
      border-color: rgba(255, 255, 255, 0.22);
      background-color: #18181e;
      transform: translateY(-1px);
    }
    .mcq-opt.correct {
      border: 2px solid #10b981 !important;
      background-color: rgba(16, 185, 129, 0.14) !important;
      box-shadow: 0 0 16px rgba(16, 185, 129, 0.22) !important;
    }
    .mcq-opt.correct .opt-letter {
      background-color: #10b981 !important;
      color: #ffffff !important;
      border-color: #10b981 !important;
      font-weight: 700 !important;
    }
    .mcq-opt.correct .opt-text {
      color: #34d399 !important;
      font-weight: 600 !important;
    }
    .mcq-opt.wrong {
      border: 2px solid #ef4444 !important;
      background-color: rgba(239, 68, 68, 0.14) !important;
      box-shadow: 0 0 16px rgba(239, 68, 68, 0.22) !important;
    }
    .mcq-opt.wrong .opt-letter {
      background-color: #ef4444 !important;
      color: #ffffff !important;
      border-color: #ef4444 !important;
      font-weight: 700 !important;
    }
    .mcq-opt.wrong .opt-text {
      color: #fb7185 !important;
      font-weight: 600 !important;
    }

    /* Hero & Chat Transitions */
    #heroView {
      transition: opacity 0.28s cubic-bezier(0.16, 1, 0.3, 1), transform 0.28s cubic-bezier(0.16, 1, 0.3, 1);
    }
    #heroView.hidden-state {
      opacity: 0;
      transform: translateY(-12px);
      display: none;
    }

    #chatView {
      transition: opacity 0.28s cubic-bezier(0.16, 1, 0.3, 1), transform 0.28s cubic-bezier(0.16, 1, 0.3, 1);
    }
    #chatView.hidden-state {
      opacity: 0;
      transform: translateY(10px);
      display: none;
    }
  </style>
</head>
<body class="min-h-screen flex overflow-hidden bg-app-bg text-app-text">

  <div class="ambient-glow"></div>

  <!-- ========================================================= -->
  <!-- 1. MINIMALIST COLLAPSIBLE SIDEBAR                         -->
  <!-- ========================================================= -->
  <div id="sidebarBackdrop" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-30 hidden md:hidden" onclick="toggleSidebar()"></div>

  <aside id="sidebar" class="fixed md:static inset-y-0 left-0 w-[260px] bg-app-sidebar border-r border-white/[0.07] z-40 flex flex-col justify-between -translate-x-full md:translate-x-0 transition-transform duration-250 select-none">
    
    <!-- Top: Brand & Action Buttons -->
    <div class="pt-4 px-3.5 pb-2 space-y-3">
      <!-- Brand Row with Logo & Collapse Toggle -->
      <div class="flex items-center justify-between px-0.5">
        <div class="flex items-center cursor-pointer group py-0.5" onclick="resetToHome()" title="বোধ">
          <img src="/assets/bodh-custom-logo.png" alt="বোধ" class="h-8 w-auto object-contain opacity-95 group-hover:opacity-100 transition-all duration-200 drop-shadow-[0_0_12px_rgba(255,255,255,0.06)]" />
        </div>

        <button onclick="toggleSidebar()" class="text-zinc-400 hover:text-zinc-200 p-1.5 rounded-lg hover:bg-white/[0.06] transition cursor-pointer" title="সাইডবার টগল">
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
            <line x1="9" y1="3" x2="9" y2="21"/>
          </svg>
        </button>
      </div>

      <!-- New Chat Button (Sleek Obsidian Surface) -->
      <button onclick="resetToHome(); if(window.innerWidth < 768) toggleSidebar();" 
        class="w-full py-2.5 px-3 rounded-xl bg-app-surface/90 hover:bg-white/[0.06] border border-white/[0.08] hover:border-white/[0.16] text-[13.5px] font-medium text-zinc-200 hover:text-white flex items-center justify-between transition cursor-pointer shadow-sm group">
        <span class="flex items-center gap-2.5">
          <svg class="w-4 h-4 text-zinc-400 group-hover:text-zinc-200 transition" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path stroke-linecap="round" stroke-linejoin="round" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
          </svg>
          <span>নতুন আলোচনা</span>
        </span>
        <kbd class="text-[10px] font-mono text-zinc-400 bg-white/[0.03] px-1.5 py-0.5 rounded border border-white/[0.06]">Ctrl K</kbd>
      </button>
    </div>

    <!-- Middle: Recents Section Header & History List with ChatGPT-style font & scroll -->
    <div class="flex-1 overflow-y-auto px-2 space-y-1 chatgpt-scroll pt-1">
      <div class="px-3 pt-2 pb-1.5 text-[11px] font-medium text-zinc-500 uppercase tracking-wider">
        সাম্প্রতিক আলোচনা
      </div>
      <div id="recentChatsList" class="space-y-0.5">
        <div class="px-3 py-3 text-zinc-500 text-xs italic">কোনো পূর্ববর্তী আলোচনা নেই</div>
      </div>
    </div>

    <!-- Bottom: Academic System Footbar (Theme Harmonized) -->
    <div class="p-3 border-t border-white/[0.07] flex items-center justify-between text-xs text-zinc-400 bg-app-sidebar">
      <div class="flex items-center gap-2">
        <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 ring-2 ring-emerald-500/20"></span>
        <span class="text-[11.5px] font-mono text-zinc-400">Turso LibSQL Connected</span>
      </div>
      <button onclick="clearAllSessions()" class="p-1.5 hover:text-rose-400 rounded-lg hover:bg-white/[0.06] text-zinc-400 transition cursor-pointer" title="সকল হিস্ট্রি মুছে ফেলুন">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
      </button>
    </div>
  </aside>

  <!-- ========================================================= -->
  <!-- 2. MAIN VIEW AREA                                         -->
  <!-- ========================================================= -->
  <main class="flex-1 flex flex-col min-w-0 h-screen bg-app-bg relative z-10">
    
    <!-- Top Header (Clean 56px) -->
    <header class="h-14 border-b border-white/[0.07] flex items-center justify-between px-4 shrink-0 bg-app-bg/90 backdrop-blur-md z-20">
      <div class="flex items-center gap-3">
        <button onclick="toggleSidebar()" class="md:hidden text-zinc-400 hover:text-white p-1.5 rounded-lg hover:bg-white/[0.06] transition cursor-pointer" title="সাইডবার টগল">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <div class="flex items-center cursor-pointer group py-0.5" onclick="resetToHome()" title="হোমপেজে ফিরুন">
          <img src="/assets/bodh-custom-logo.png" alt="বোধ" class="h-8 sm:h-9 w-auto object-contain opacity-95 group-hover:opacity-100 transition-all duration-200 drop-shadow-[0_0_12px_rgba(255,255,255,0.06)] group-hover:drop-shadow-[0_0_18px_rgba(255,255,255,0.18)]" />
        </div>
      </div>
      
      <button onclick="resetToHome()" class="text-xs text-zinc-400 hover:text-white flex items-center gap-1.5 px-2.5 py-1.5 rounded-xl hover:bg-white/[0.06] border border-transparent hover:border-white/[0.08] transition cursor-pointer">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
        <span class="hidden sm:inline font-mono text-[11px]">New</span>
      </button>
    </header>

    <!-- Content Area (Scrollable) -->
    <div id="contentScrollArea" class="flex-1 overflow-y-auto px-4 pt-6 pb-36 flex flex-col scroll-smooth">
      
      <!-- HERO VIEW (Centered Home) -->
      <div id="heroView" class="w-full max-w-2xl mx-auto my-auto flex flex-col items-center text-center space-y-5">
        
        <!-- Clean, Compact Emblem with subtle ambient glow -->
        <div class="flex items-center justify-center">
          <img src="/assets/bodh-custom-logo.png" alt="বোধ" 
            class="h-16 sm:h-20 w-auto object-contain select-none pointer-events-none opacity-95 drop-shadow-[0_0_24px_rgba(255,255,255,0.08)] transition-transform duration-200" />
        </div>

        <div class="space-y-1 text-center -mt-1">
          <p class="text-xs sm:text-sm text-zinc-400 font-normal">
            না বুঝে মুখস্থ নয়, পড়াশোনায় এবার গভীর বোধ
          </p>
        </div>

        <!-- Central Input Box -->
        <div class="w-full rounded-[24px] p-1 bg-white/[0.02] border border-white/[0.08] focus-within:border-white/20 focus-within:bg-white/[0.04] shadow-[0_8px_32px_rgba(0,0,0,0.4)] transition duration-200">
          <div class="bg-app-surface rounded-[20px] p-3 border border-white/[0.04]">
            <form onsubmit="handleHeroSubmit(event)" class="flex flex-col gap-2">
              <textarea id="heroInput" rows="2" placeholder="যেমন: রসায়ন অধ্যায়গুলোর তালিকা দাও, কিংবা গতির সমীকরণ বোঝাও..."
                class="w-full bg-transparent border-none px-2 py-1 text-sm text-white focus:outline-none placeholder:text-zinc-500 resize-none leading-relaxed"
                onkeydown="if(event.key==='Enter' && !event.shiftKey){ event.preventDefault(); handleHeroSubmit(event); }"></textarea>
              
              <div class="flex items-center justify-between pt-2 border-t border-white/[0.06]">
                <span class="text-[11px] font-mono text-zinc-500 pl-2">৫০,৮৫৫টি বোর্ড ও কলেজ প্রশ্ন</span>
                <button type="submit" class="w-7 h-7 rounded-lg bg-white text-zinc-900 hover:bg-zinc-200 active:scale-95 flex items-center justify-center transition cursor-pointer shadow">
                  <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 12h14M12 5l7 7-7 7"/></svg>
                </button>
              </div>
            </form>
          </div>
        </div>

        <!-- Minimalist Prompt Chips -->
        <div class="flex flex-wrap justify-center gap-2 max-w-lg pt-1">
          <button onclick="submitPrompt('রসায়ন বিষয়ের সবগুলো অধ্যায়ের নাম দাও')" 
            class="text-xs px-3.5 py-1.5 rounded-xl border border-white/[0.08] hover:border-white/20 bg-app-surface/80 hover:bg-app-surface text-zinc-300 transition shadow-sm hover:-translate-y-0.5">
            রসায়ন অধ্যায় তালিকা
          </button>
          <button onclick="submitPrompt('রসায়ন বিষয়ের সবচেয়ে গুরুত্বপূর্ণ অধ্যায় কোনগুলো এবং কেন?')" 
            class="text-xs px-3.5 py-1.5 rounded-xl border border-white/[0.08] hover:border-white/20 bg-app-surface/80 hover:bg-app-surface text-zinc-300 transition shadow-sm hover:-translate-y-0.5">
            রসায়ন টপ অধ্যায়
          </button>
          <button onclick="submitPrompt('পদার্থবিজ্ঞান গতি অধ্যায়ের সবগুলো মাস্টার টাইপ ও সূত্র দাও')" 
            class="text-xs px-3.5 py-1.5 rounded-xl border border-white/[0.08] hover:border-white/20 bg-app-surface/80 hover:bg-app-surface text-zinc-300 transition shadow-sm hover:-translate-y-0.5">
            গতির মাস্টার টাইপ
          </button>
          <button onclick="submitPrompt('কম পড়ে সাধারণ গণিতে নিশ্চিত ৭০ এ ৭০ পাওয়ার রোডম্যাপ দাও')" 
            class="text-xs px-3.5 py-1.5 rounded-xl border border-white/[0.08] hover:border-white/20 bg-app-surface/80 hover:bg-app-surface text-zinc-300 transition shadow-sm hover:-translate-y-0.5">
            গণিত ৭০ এ ৭০ রোডম্যাপ
          </button>
        </div>

      </div>

      <!-- CHAT VIEW (Active Conversation) -->
      <div id="chatView" class="hidden w-full max-w-2xl mx-auto space-y-6 pb-40">
        <div id="messagesArea" class="space-y-6"></div>
      </div>

    </div>

    <!-- DOCKED STICKY BOTTOM INPUT (When Chat is Active) -->
    <div id="dockedBar" class="hidden absolute bottom-0 inset-x-0 pb-4 pt-6 px-4 bg-gradient-to-t from-[#09090b] via-[#09090b]/90 to-transparent z-20 pointer-events-none">
      <div class="max-w-2xl mx-auto pointer-events-auto">
        <div class="rounded-[24px] p-1 bg-white/[0.02] border border-white/[0.08] focus-within:border-white/20 focus-within:bg-white/[0.04] shadow-[0_8px_32px_rgba(0,0,0,0.5)] transition duration-200">
          <div class="bg-app-surface rounded-[20px] p-2 pl-3 border border-white/[0.04]">
            <form onsubmit="handleDockedSubmit(event)" class="flex items-end gap-2">
              <textarea id="dockedInput" rows="1" placeholder="প্রশ্ন বা উত্তরের বিকল্প লিখো..." 
                class="flex-1 bg-transparent border-none px-2 py-1 text-sm text-white focus:outline-none placeholder:text-zinc-500 resize-none max-h-32 leading-relaxed"

    function generateSessionTitle(prompt) {
      if (!prompt) return "নতুন আলোচনা";
      let clean = prompt.trim().split('\n')[0].replace(/\s+/g, ' ');
      clean = clean.replace(/(?:ei chapter er jonno|chapter er jonno|theke|theika)\s*(?:ekta|akta)?\s*(?:mcq|cq|prosno|question)\s*(?:dio|dao|den)?/gi, (m) => {
        if (/mcq/i.test(m)) return ' (MCQ)';
        if (/cq/i.test(m)) return ' (CQ)';
        return '';
      });
      clean = clean.replace(/\s+(?:dao|dio|den|bolen|koren|bolo|chai|lagbe)$/i, '');
      clean = clean.replace(/\s+/g, ' ').trim();
      if (clean.length > 34) {
        clean = clean.slice(0, 32) + '...';
      }
      return clean || "একাডেমিক আলোচনা";
    }

    function toBnDigits(num) {
      if (num === undefined || num === null) return "";
      const bn = ["০", "১", "২", "৩", "৪", "৫", "৬", "৭", "৮", "৯"];
      return String(num).replace(/[0-9]/g, d => bn[d]);
    }

    // Exact Reference Generator: Builds intelligent academic thought tree

      if (s.includes('chem')) return 'রসায়ন';

      if (s.includes('high') || s.includes('h_math')) return 'উচ্চতর গণিত';
      if (s.includes('math') || s.includes('gonit')) return 'সাধারণ গণিত';
      if (s.includes('bangla') || s.includes('bng')) return 'বাংলা';
      if (s.includes('eng')) return 'ইংরেজি';
      if (s.includes('ict')) return 'তথ্য ও যোগাযোগ প্রযুক্তি';
      if (s.includes('bgs')) return 'বাংলাদেশ ও বিশ্বপরিচয়';
      if (s.includes('islam')) return 'ইসলাম ও নৈতিক শিক্ষা';

    function formatFullBoardTags(tagStr) {
      if (!tagStr) return "";
      return String(tagStr)
        .split(",")
        .map(single => {
          const clean = single.trim().replace(/^['"-]+|['"-]+$/g, '');
          if (!clean) return "";
          const match = clean.match(/^([A-Za-z.]+)\s*[-'"]*\s*(\d{2,4})?$/i);
          if (match) {
            const rawCode = match[1].toUpperCase();
            const cleanCode = rawCode.replace(/\.+$/, '');
            const yr = match[2];
            const boardName = BOARD_NAME_MAP[rawCode] || BOARD_NAME_MAP[cleanCode] || match[1];
            if (yr) {
              const fullYr = yr.length === 2 ? (parseInt(yr, 10) > 70 ? `19${yr}` : `20${yr}`) : yr;
              return `${boardName} ${toBnDigits(fullYr)}`;
            }
            return boardName;
          }
          return toBnDigits(clean);
        })
        .filter(Boolean)
        .join(', ');
    }

    function isAcademicPrompt(t) {
      if (!t) return false;

        'পদার্থ', 'physics', 'রসায়ন', 'রসায়ন', 'chem', 'biology', 'জীববিজ্ঞান',

        'আরেকটা', 'arekta', 'next', 'hard', 'easy', 'অন্য', 'অন্যটি', 'কুইজ', 'নৈর্ব্যক্তিক'
      ];
      return kw.some(k => s.includes(k));
    }

    // Exact Reference Generator: Builds intelligent, student-friendly academic thoughts
    function generateThoughtTreeData(tool, args, result, userPrompt = '') {

        const numMatch = userPrompt.match(/(?:অধ্যায়|অধ্যায়|chapter|ch)\s*([০-৯0-9]+)/i);
        if (numMatch) {
          rawTopic = `অধ্যায় ${toBnDigits(numMatch[1])}`;

          if (beforeChMatch && beforeChMatch[1].trim() && !/^(ei|oi|ekta|akta|kono|any|theke|theika)$/i.test(beforeChMatch[1].trim())) {

    // Toggle entire Thought Tree
    function toggleThoughtTree(treeId, triggerEl) {
      const tree = document.getElementById(treeId);
      if (!tree) return;
      const chevron = triggerEl.querySelector('.thought-chevron');
      if (tree.classList.contains('collapsed')) {
        tree.classList.remove('collapsed');
        if (chevron) chevron.style.transform = 'rotate(0deg)';
      } else {
        tree.classList.add('collapsed');
        if (chevron) chevron.style.transform = 'rotate(-90deg)';
      }
    }

    // Toggle individual Think sub-step
    function toggleSubStep(triggerEl) {
      const step = triggerEl.closest('.thought-step');
      if (!step) return;
      const content = step.querySelector('.thought-sub-content');
      const chevron = triggerEl.querySelector('svg:last-child');
      if (!content) return;
      if (content.classList.contains('collapsed')) {
        content.classList.remove('collapsed');
        if (chevron) chevron.style.transform = 'rotate(0deg)';
      } else {
        content.classList.add('collapsed');
        if (chevron) chevron.style.transform = 'rotate(-90deg)';
      }
    }

    function streamThinkingText(el, text, speedMs = 12, onComplete = null) {
      if (!el || !text) {
        if (typeof onComplete === 'function') onComplete();
        return;
      }
      el.innerHTML = '';
      const cursor = document.createElement('span');
      cursor.className = 'inline-block w-1.5 h-3 bg-zinc-400/80 animate-pulse ml-1 align-middle rounded-full thought-cursor';
      el.appendChild(cursor);

      let i = 0;
      const timer = setInterval(() => {
        if (i < text.length) {
          cursor.before(document.createTextNode(text[i]));
          i++;
        } else {
          clearInterval(timer);
          if (cursor.parentNode) cursor.remove();
          if (typeof onComplete === 'function') onComplete();
        }
      }, speedMs);
    }

    const streamThoughtText = (el, txt, spd) => streamThinkingText(el, txt, spd);

    function renderRecentChats() {
      const container = document.getElementById('recentChatsList');
      if (!container) return;
      if (!chatSessions || chatSessions.length === 0) {
        container.innerHTML = '<div class="px-3 py-4 text-zinc-500 text-xs italic text-center">কোনো পূর্ববর্তী আলোচনা নেই</div>';
        return;
      }

      container.innerHTML = chatSessions.map((session) => {
        const isActive = session.id === currentSessionId;
        const activeClass = isActive 
          ? 'bg-white/[0.08] text-white border-white/[0.12] font-medium shadow-sm' 
          : 'text-zinc-300 hover:bg-white/[0.04] hover:text-white border-transparent';
        
        return `
          <div class="group relative flex items-center w-full rounded-xl border transition-all duration-150 ${activeClass}">
            <button onclick="loadSession('${session.id}'); if(window.innerWidth < 768) toggleSidebar();" 
              class="flex-1 flex items-center gap-2.5 px-3 py-2 text-left min-w-0 cursor-pointer" 
              title="${escapeHtml(session.title)}">
              <svg class="w-3.5 h-3.5 shrink-0 ${isActive ? 'text-emerald-400' : 'text-zinc-500 group-hover:text-zinc-300'}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <path stroke-linecap="round" stroke-linejoin="round" d="M8 10h.01M12 10h.01M16 10h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/>
              </svg>
              <span class="truncate text-[13px] leading-tight flex-1">${escapeHtml(session.title)}</span>
            </button>
            <button onclick="deleteSession('${session.id}', event)" 
              class="opacity-0 group-hover:opacity-100 p-1.5 mr-1 text-zinc-500 hover:text-rose-400 hover:bg-white/[0.08] rounded-lg transition-opacity cursor-pointer shrink-0" 
              title="আলোচনা মুছুন">
              <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
              </svg>
            </button>
          </div>
        `;
      }).join('');
    }

    function loadSession(id) {
      if (isProcessing) return;
      const session = chatSessions.find(s => s.id === id);
      if (!session) return;

      currentSessionId = session.id;
      conversationHistory = Array.isArray(session.conversationHistory) 
        ? JSON.parse(JSON.stringify(session.conversationHistory)) 
        : [];

      const msgs = document.getElementById('messagesArea');
      if (msgs) {
        msgs.innerHTML = session.html || '';
      }

      activateChatView();
      renderRecentChats();
      scrollToBottom();
    }

    function deleteSession(id, event) {
      if (event) event.stopPropagation();
      chatSessions = chatSessions.filter(s => s.id !== id);
      saveSessions();

      if (currentSessionId === id) {
        resetToHome();
      } else {
        renderRecentChats();
      }
    }

    function clearAllSessions() {
      if (!chatSessions || chatSessions.length === 0) return;
      if (!confirm('আপনি কি নিশ্চিত যে সকল পূর্ববর্তী আলোচনা মুছে ফেলতে চান?')) return;
      chatSessions = [];
      saveSessions();
      resetToHome();
    }

    function toggleSidebar() {
      const sb = document.getElementById('sidebar');
      const bd = document.getElementById('sidebarBackdrop');
      sb.classList.toggle('-translate-x-full');
      bd.classList.toggle('hidden');
    }

    function resetToHome() {
      if (isProcessing) return;
      currentSessionId = null;
      isChatActive = false;
      conversationHistory = [];
      const hero = document.getElementById('heroView');
      const chat = document.getElementById('chatView');
      const docked = document.getElementById('dockedBar');
      const msgs = document.getElementById('messagesArea');
      
      if (msgs) msgs.innerHTML = '';
      if (chat) chat.classList.add('hidden');
      if (docked) docked.classList.add('hidden');
      
      if (hero) {
        hero.classList.remove('hidden');
        hero.classList.add('flex');
      }
      const heroInp = document.getElementById('heroInput');
      if (heroInp) {
        heroInp.value = '';
        setTimeout(() => heroInp.focus(), 50);
      }
      renderRecentChats();
    }

    function activateChatView() {
      if (isChatActive) return;
      isChatActive = true;
      const hero = document.getElementById('heroView');
      const chat = document.getElementById('chatView');
      const docked = document.getElementById('dockedBar');

      hero.classList.add('hidden');
      hero.classList.remove('flex');
      chat.classList.remove('hidden');
      docked.classList.remove('hidden');
      setTimeout(() => {
        const dockedInp = document.getElementById('dockedInput');
        if (dockedInp) dockedInp.focus();
      }, 50);
    }

    function handleHeroSubmit(e) {
      e.preventDefault();
      const inp = document.getElementById('heroInput');
      const txt = inp.value.trim();
      if (!txt || isProcessing) return;
      activateChatView();
      sendMessage(txt);
      inp.value = '';
    }

    function handleDockedSubmit(e) {
      e.preventDefault();
      const inp = document.getElementById('dockedInput');
      const txt = inp.value.trim();
      if (!txt || isProcessing) return;
      activateChatView();
      sendMessage(txt);
      inp.value = '';
      inp.style.height = 'auto';
    }

    function submitPrompt(text) {
      if (isProcessing) return;
      activateChatView();
      sendMessage(text);
    }

    function normLetter(ch) {
      if (!ch) return '';
      const c = ch.trim().toLowerCase();
      if (c === 'a' || c === 'ক') return 'ক';
      if (c === 'b' || c === 'খ') return 'খ';
      if (c === 'c' || c === 'গ') return 'গ';
      if (c === 'd' || c === 'ঘ') return 'ঘ';
      return c;
    }

    // Interactive MCQ Selection (High-contrast Red/Green Feedback)
    function handleOptionClick(btn, letter) {
      if (isProcessing) return;
      const cardWrapper = btn.closest('.mcq-wrapper');
      let correct = cardWrapper ? cardWrapper.getAttribute('data-correct') : null;
      if (correct) correct = correct.trim();

      const chosenNorm = normLetter(letter);
      const correctNorm = normLetter(correct);
      const isCorrect = Boolean(correctNorm && chosenNorm === correctNorm);

      const grid = btn.closest('.mcq-options-grid');
      if (grid) {
        grid.querySelectorAll('.mcq-opt').forEach(opt => {
          opt.classList.add('pointer-events-none');
          const optL = (opt.getAttribute('data-letter') || '').trim();
          const optLNorm = normLetter(optL);
          const badge = opt.querySelector('.opt-badge');

          if (correctNorm && optLNorm === correctNorm) {
            opt.classList.add('correct');
            if (badge) {
              badge.innerHTML = '<span class="text-emerald-400 text-sm font-bold">✓</span>';
              badge.classList.remove('hidden');
            }
          } else if (optLNorm === chosenNorm && !isCorrect) {
            opt.classList.add('wrong');
            if (badge) {
              badge.innerHTML = '<span class="text-rose-400 text-sm font-bold">✕</span>';
              badge.classList.remove('hidden');
            }
          } else {
            opt.classList.add('opacity-35');
          }
        });
      }

      // Save interactive selection in session snapshot
      const currSession = chatSessions.find(s => s.id === currentSessionId);
      if (currSession) {
        const areaEl = document.getElementById('messagesArea');
        if (areaEl) {
          const clone = areaEl.cloneNode(true);
          clone.querySelectorAll('.streaming-cursor, .thought-cursor, [id^="writingPulse_"]').forEach(el => el.remove());
          currSession.html = clone.innerHTML;
          saveSessions();
        }
      }

      // No redundant banner inside the card — the conversational tutor below gives the full explanation!
      const replyMsg = `আমার উত্তর (${letter})`;
      sendMessage(replyMsg);
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    // Content Formatter (Markdown + KaTeX Math + Robust Multi-MCQ Extraction)
    function renderFormattedContent(rawText, extraBoardTag = null, extraAns = null) {
      if (!rawText) return "";

      let clean = rawText
        .replace(/<\/?(?:thought|thinking|কুইজ|quiz|কথা|kotha|স্ট্যাটাস|status|প্রশ্ন|question|উত্তর|answer|message|response|text|mcq|cq)>/gi, '')
        .replace(/<[\u0980-\u09FF_-]+>|<\/[\u0980-\u09FF_-]+>/g, '');

      // 1. Extract Board Reference Tag (cleanly removes tag from text without leaking placeholder)
      let boardTagsHtml = "";
      clean = clean.replace(/\[(?:বোর্ড|Board):?\s*([^\]]+)\]/gi, (match, tag) => {
        const formatted = formatFullBoardTags(tag);
        const tags = formatted.split(',').map(x => x.trim()).filter(Boolean);
        boardTagsHtml = tags.map(b => `<span class="px-2 py-0.5 rounded text-[10px] font-mono bg-white/[0.06] text-zinc-300 border border-white/[0.08]">${escapeHtml(b)}</span>`).join(' ');
        return '';
      });
      clean = clean.replace(/%%%BOARD_CONTAINER%%%/gi, '');

      if (!boardTagsHtml && extraBoardTag) {
        const formatted = formatFullBoardTags(extraBoardTag);
        const tags = formatted.split(',').map(x => x.trim()).filter(Boolean);
        boardTagsHtml = tags.map(b => `<span class="px-2 py-0.5 rounded text-[10px] font-mono bg-white/[0.06] text-zinc-300 border border-white/[0.08]">${escapeHtml(b)}</span>`).join(' ');
      }

      // 2. Extract detected answer tag
      let detectedAns = null;
      clean = clean.replace(/\[ans:\s*([ক-ঘa-dA-D])\]/gi, (m, g) => {
        detectedAns = g;
        return '';
      });
      if (!detectedAns && extraAns) {
        const toBnAns = { 'A': 'ক', 'B': 'খ', 'C': 'গ', 'D': 'ঘ', 'a': 'ক', 'b': 'খ', 'c': 'গ', 'd': 'ঘ' };
        detectedAns = toBnAns[extraAns] || extraAns;
      }

      // 3. Protect KaTeX Display Math ($$...$$ and \[...\])
      const displayMath = [];
      clean = clean.replace(/(?:\$\$([\s\S]*?)\$\$|\\\[([\s\S]*?)\\\])/g, (m, c1, c2) => {
        const code = c1 !== undefined ? c1 : c2;
        displayMath.push(code);
        return '%%%MATH_D_' + (displayMath.length - 1) + '%%%';
      });

      // 4. Protect KaTeX Inline Math ($...$, \(...\), and parenthesized/standalone LaTeX formulas like (\mathrm{pH}=7))
      const inlineMath = [];
      clean = clean.replace(/(?:(?<!\\)\$([^\$\n]+?)(?<!\\)\$|\\\(([^\\\n]*?)\\\)|\(([^()\n]*?\\[a-zA-Z]+[^()\n]*?)\)|(\\[a-zA-Z]+(?:\{[^\}\n]*\})*(?:[\s_^\-\+*\/=<>]+[a-zA-Z0-9\(\)\{\}\\]+)*))/g, (m, c1, c2, c3, c4) => {
        const code = c1 !== undefined ? c1 : (c2 !== undefined ? c2 : (c3 !== undefined ? c3 : c4));
        inlineMath.push(code);
        return '%%%MATH_I_' + (inlineMath.length - 1) + '%%%';
      });

      // 5. Robust Raw-Text MCQ Option Extraction (Handles blank lines, bullets, bolding, multi-MCQs)
      const singleOptionLineRegex = /^[ \t]*(?:[-*+]\s+)?(?:\*{1,2})?(?:\(([ক-ঘa-dA-D])\)|([ক-ঘa-dA-D])[\.\)])(?:\*{1,2})?[ \t]+([^\r\n]+)/;

      const lines = clean.split(/\r?\n/);
      const clusters = [];
      let currentCluster = null;

      function isCreativeQuestionCluster(cluster, fullText) {
        if (!cluster || !cluster.items || cluster.items.length === 0) return false;
        // If explicitly tagged as MCQ or Quiz, it is NEVER a Creative Question
        if (/\bMCQ\b|নৈর্ব্যক্তিক|বহুনির্বাচনী|কুইজ/i.test(fullText)) {
          return false;
        }
        if (/উদ্দীপক|সৃজনশীল|\bCQ\b|\bCQ_\d\b|সৃজনশীল প্রশ্ন/i.test(fullText)) {
          return true;
        }
        const cqKeywords = /(?:কাকে বলে|কী\?|কেন\?|কীভাবে|ব্যাখ্যা কর|বিশ্লেষণ কর|নির্ণয় কর|হিসাব কর|প্রমাণ কর|লেখো|চিহ্নিত কর|তুলনা কর|উদ্বৃত্ত|বিক্রিয়াটি লেখ|পার্থক্য|ধর্ম ব্যাখ্যা|প্রক্রিয়া|উপযোগিতা|যৌগটির|মৌলটির)/i;
        if (cluster.items.some(it => cqKeywords.test(it.text))) return true;
        if (cluster.items.some(it => it.text.length > 60)) return true;
        return false;
      }

      for (let i = 0; i < lines.length; i++) {
        const line = lines[i];
        const match = line.match(singleOptionLineRegex);

        if (match) {
          const letter = match[1] || match[2];
          const text = match[3].replace(/\*{2,4}$/, '').trim();
          if (!currentCluster) {
            currentCluster = { startIndex: i, endIndex: i, items: [] };
          }
          currentCluster.endIndex = i;
          currentCluster.items.push({ letter, text, lineIdx: i });
        } else if (line.trim() === "") {
          // Keep cluster active across blank lines between options
        } else {
          if (currentCluster) {
            if (currentCluster.items.length >= 2 && !isCreativeQuestionCluster(currentCluster, clean)) {
              clusters.push(currentCluster);
            }
            currentCluster = null;
          }
        }
      }
      if (currentCluster && currentCluster.items.length >= 2 && !isCreativeQuestionCluster(currentCluster, clean)) {
        clusters.push(currentCluster);
      }

      const cards = [];
      for (let c = clusters.length - 1; c >= 0; c--) {
        const cluster = clusters[c];
        const firstLineIdx = cluster.startIndex;
        let lastLineIdx = cluster.endIndex;

        let explanationLines = [];
        let foundAnsInExp = null;
        let scanIdx = lastLineIdx + 1;

        while (scanIdx < lines.length && lines[scanIdx].trim() === "") {
          scanIdx++;
        }

        // Cleanly strip any trailing answer/explanation lines to prevent spoiler leaks
        while (scanIdx < lines.length && /^\s*(?:\*{0,2}(?:সঠিক উত্তর|Answer|Ans|ব্যাখ্যা|Explanation):)/i.test(lines[scanIdx])) {
          explanationLines.push(lines[scanIdx]);
          lastLineIdx = scanIdx;
          scanIdx++;

          let consecutiveBlanks = 0;
          while (scanIdx < lines.length) {
            const expLine = lines[scanIdx];
            if (expLine.trim() === "") {
              consecutiveBlanks++;
              if (consecutiveBlanks >= 2) break;
              explanationLines.push(expLine);
            } else {
              if (/^(?:#{1,4}\s+|MCQ:|\d+[\.\)]|প্রশ্ন\s*[:\d])/i.test(expLine.trim())) {
                break;
              }
              if (/^\s*(?:\*{0,2}(?:সঠিক উত্তর|Answer|Ans|ব্যাখ্যা|Explanation):)/i.test(expLine)) {
                break;
              }
              consecutiveBlanks = 0;
              explanationLines.push(expLine);
            }
            lastLineIdx = scanIdx;
            scanIdx++;
          }
        }

        const explanationText = explanationLines.join('\n').trim();
        if (explanationText) {
          const expAnsM = explanationText.match(/(?:সঠিক উত্তর|Answer|Ans)[:\s]*\(([ক-ঘa-dA-D])\)|(?:সঠিক উত্তর|Answer|Ans)[:\s]*([ক-ঘa-dA-D])/i);
          if (expAnsM) {
            foundAnsInExp = expAnsM[1] || expAnsM[2];
          }
        }

        const targetAns = detectedAns || foundAnsInExp || '';

        const optionsHtml = cluster.items.map(it => `
          <button type="button" 
            class="mcq-opt flex items-center justify-between gap-2.5 p-3 rounded-xl text-left w-full cursor-pointer shadow-sm relative overflow-hidden"
            data-letter="${it.letter}"
            onclick="handleOptionClick(this, '${it.letter}')">
            <div class="flex items-center gap-2.5 min-w-0">
              <span class="opt-letter w-6 h-6 rounded-md bg-white/[0.06] text-zinc-300 font-mono text-xs flex items-center justify-center font-semibold shrink-0 border border-white/[0.08] transition-all">
                ${it.letter}
              </span>
              <span class="opt-text text-xs sm:text-sm text-zinc-200 transition-colors truncate">${it.text}</span>
            </div>
            <span class="opt-badge hidden text-xs font-bold shrink-0"></span>
          </button>
        `).join('');

        const placeholder = `%%%MCQ_PLACEHOLDER_${c}%%%`;
        const cardHtml = `
          <div class="mcq-wrapper my-3 bg-app-surface border border-white/[0.08] rounded-2xl p-3.5 space-y-3 shadow-md" data-correct="${targetAns}">
            ${boardTagsHtml ? `<div class="flex flex-wrap gap-1.5 pb-2 border-b border-white/[0.06]">${boardTagsHtml}</div>` : ''}
            <div class="mcq-options-grid grid grid-cols-1 sm:grid-cols-2 gap-2">
              ${optionsHtml}
            </div>
          </div>
        `;

        lines.splice(firstLineIdx, (lastLineIdx - firstLineIdx + 1), placeholder);
        cards.push({ placeholder, cardHtml });
      }

      clean = lines.join('\n');

      // 6. Parse Markdown
      let html = "";
      try {
        html = marked.parse(clean);
      } catch (e) {
        html = escapeHtml(clean);
      }

      // 7. Inject MCQ Cards
      for (const card of cards) {
        const reg = new RegExp(`<p>\\s*${card.placeholder}\\s*<\\/p>|${card.placeholder}`, 'g');
        html = html.replace(reg, card.cardHtml);
      }

      // 8. Restore KaTeX Display Math (Memoized for 60fps streaming)
      html = html.replace(/%%%MATH_D_(\d+)%%%/g, (m, idx) => {
        const code = displayMath[parseInt(idx, 10)];
        if (!code) return m;
        return getRenderedKaTeX(code, true);
      });

      // 9. Restore KaTeX Inline Math (Memoized for 60fps streaming)
      html = html.replace(/%%%MATH_I_(\d+)%%%/g, (m, idx) => {
        const code = inlineMath[parseInt(idx, 10)];
        if (!code) return m;
        return getRenderedKaTeX(code, false);
      });

      html = html.replace(/<p>\s*\[ans:[^\]]*\]\s*<\/p>|\[ans:[^\]]*\]/gi, '');
      html = html.replace(/<p>\s*<\/p>/g, '');
      return html;
    }

    function renderFormattedContentWithCursor(rawText, showCursor = true, extraBoardTag = null, extraAns = null) {
      const rendered = renderFormattedContent(rawText, extraBoardTag, extraAns);
      if (!showCursor) return rendered;
      return rendered + '<span class="inline-block w-1.5 h-3.5 bg-zinc-400 animate-pulse ml-1 align-middle rounded-full"></span>';
    }

    // High-performance KaTeX memoization cache to prevent CPU thrashing during streaming
    const katexCache = new Map();
    function getRenderedKaTeX(latex, displayMode) {
      if (!latex) return '';
      let cleanLatex = String(latex).trim()
        .replace(/\\\\+/g, '\\')
        .replace(/\\+$/, '')
        .replace(/\\mathrm\{\s*~?\s*\}/g, '')
        .replace(/~+/g, ' ')
        .trim();
      if (!cleanLatex) return '';

      const key = (displayMode ? 'D:' : 'I:') + cleanLatex;
      if (katexCache.has(key)) return katexCache.get(key);
      let rendered = '';
      if (window.katex) {
        try {
          rendered = window.katex.renderToString(cleanLatex, { displayMode, throwOnError: true });
        } catch(e) {
          // If complex latex fails, render as clean chemical formula text (never show red raw code)
          const fallbackText = cleanLatex
            .replace(/\\mathrm\{([^}]*)\}/g, '$1')
            .replace(/\\text\{([^}]*)\}/g, '$1')
            .replace(/\\/g, '')
            .trim();
          rendered = displayMode ? `<div class="katex-display font-medium text-zinc-100">${escapeHtml(fallbackText || cleanLatex)}</div>` : `<span class="katex-inline font-medium text-zinc-100">${escapeHtml(fallbackText || cleanLatex)}</span>`;
        }
      } else {
        rendered = displayMode ? `<div class="katex-display font-medium text-zinc-100">${escapeHtml(cleanLatex)}</div>` : `<span class="katex-inline font-medium text-zinc-100">${escapeHtml(cleanLatex)}</span>`;
      }
      if (katexCache.size < 1200) katexCache.set(key, rendered);
      return rendered;
    }

    function renderFormattedContentWithCursor(rawText, isStreaming = false, extraBoardTag = null, extraAns = null) {
      if (!rawText) return "";
      
      // Clean up empty trailing table pipes
      let cleanText = rawText.replace(/\|\s*\|\s*$/gm, '|');
      let html = renderFormattedContent(cleanText, extraBoardTag, extraAns);
      if (!isStreaming) return html;

      const cursorHtml = '<span class="streaming-cursor"></span>';
      
      // Attach cursor before the last closing text tag (p, li, td, h1-h6) so it stays inline with text
      const match = html.match(/<\/(?:p|li|td|h[1-6]|span)>(?![\s\S]*<\/(?:p|li|td|h[1-6]|span)>)/i);
      if (match && match.index !== undefined) {
        return html.slice(0, match.index) + cursorHtml + html.slice(match.index);
      }
      return html + cursorHtml;
    }

    // High-speed smooth typewriter stream for academic thinking monologue
    function streamThinkingText(targetEl, fullText, speedMs = 18, onComplete = null) {
      if (!targetEl || !fullText) {
        if (onComplete) onComplete();
        return null;
      }
      targetEl.innerHTML = '';
      
      const words = fullText.match(/\S+|\s+/g) || [fullText];
      let currentIdx = 0;
      
      const cursor = document.createElement('span');
      cursor.className = 'thought-cursor inline-block w-1.5 h-3 bg-zinc-400/80 animate-pulse ml-1 align-middle rounded-full';
      targetEl.appendChild(cursor);
      
      const timer = setInterval(() => {
        if (currentIdx >= words.length) {
          clearInterval(timer);
          cursor.remove();
          if (onComplete) onComplete();
          return;
        }
        cursor.insertAdjacentText('beforebegin', words[currentIdx]);
        currentIdx++;
        scrollToBottom();
      }, speedMs);
      
      return timer;
    }

    async function sendMessage(text) {

      let streamContent = "";

      function onThinkingFinished(stepIdx) {
        isThinkingActive = false;

        if (pendingToolDone && pendingToolDone.stepIdx === stepIdx) {

      function resolveToolDone(data, stepIdx) {
        const doneData = generateThoughtTreeData(data.tool, data.args, data.result, text);
        const stepToolBadge = document.getElementById(`stepToolBadge_${stepIdx}_${msgId}`);

        const stepToolEl = document.getElementById(`stepTool_${stepIdx}_${msgId}`);
        if (stepToolEl) {
          const icon = stepToolEl.querySelector('svg');

        }
        const titleEl = document.getElementById(treeTitleId);
        if (titleEl && doneData.mainTitle) {

        isToolExecuting = false;
        const contentEl = document.getElementById(contentId);
        if (contentEl && !contentEl.innerHTML.trim()) {
          contentEl.classList.remove('hidden');

            <div class="flex items-center gap-2 text-xs text-zinc-400 py-1.5 select-none" id="writingPulse_${msgId}">

              <span class="thinking-shimmer font-medium tracking-wide text-zinc-300">উত্তর সাজানো হচ্ছে...</span>
            </div>

        performStreamRender();
      }

      // 2. Real-time stream handling
      const initialData = generateThoughtTreeData(null, null, null, text);
      const isAcademic = isAcademicPrompt(text);

      let renderRafId = null;

      function scheduleStreamRender() {
        if (renderRafId) return;
        renderRafId = requestAnimationFrame(() => {
          renderRafId = null;
          performStreamRender();

      }

      function performStreamRender() {
        const parsed = parseStreamThoughts(streamContent);

        if (parsed.hasThought) {
          const statusEl = document.getElementById(statusId);
          if (statusEl) statusEl.classList.add('hidden');

          const toolContainer = document.getElementById(toolContainerId);
          if (toolContainer) toolContainer.classList.remove('hidden');

          if (treeEl && !document.getElementById(`step1_${msgId}`)) {

                  <span class="text-zinc-500 font-bold">•</span>
                  <span>Think</span>
                  <svg class="w-3 h-3 text-zinc-500 transition-transform" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/></svg>
                </div>
                <div class="thought-sub-content pl-3 pt-1 text-[11.5px] text-zinc-400 leading-relaxed font-sans" id="step1Text_${msgId}"></div>

            `;
          }

          const step1TextEl = document.getElementById(`step1Text_${msgId}`);
          if (step1TextEl) {
            if (hasTool && initialThoughtCaptured && !isThinkingActive) {
              // Preserves the streamed thought once tool execution begins
            } else if (parsed.thought) {
              if (!hasTool) initialThoughtCaptured = parsed.thought;
              step1TextEl.innerHTML = escapeHtml(parsed.thought) + (parsed.inProgress ? '<span class="inline-block w-1.5 h-3 bg-zinc-400/80 animate-pulse ml-1 align-middle rounded-full thought-cursor"></span>' : '');
              if (parsed.inProgress) {
                isThinkingActive = true;
              } else if (isThinkingActive) {
                onThinkingFinished(toolStepIndex || 1);
              }

          }

          const answerText = parsed.answer;
          if (answerText) {

              const extraBoardTag = toolDoneEvt?.tool === 'get_mcq_quiz' ? (toolDoneEvt.result?.quiz?.[0]?.all_board_tags || toolDoneEvt.result?.quiz?.[0]?.formatted_source || (toolDoneEvt.args?.board ? toolDoneEvt.args.board + ' বোর্ড' : '')) : null;
              const extraAns = toolDoneEvt?.tool === 'get_mcq_quiz' ? (toolDoneEvt.result?.quiz?.[0]?.answer || '') : null;
              contentEl.innerHTML = renderFormattedContentWithCursor(answerText, true, extraBoardTag, extraAns);

            scrollToBottom();
          }
        } else if (!parsed.inProgress && streamContent.trim()) {
          isThinkingActive = false;
          const statusEl = document.getElementById(statusId);
          if (statusEl) statusEl.classList.add('hidden');

          if (hasTool) {
            const toolContainer = document.getElementById(toolContainerId);
            if (toolContainer) toolContainer.classList.remove('hidden');
          }

          const contentEl = document.getElementById(contentId);
          if (contentEl) {
            contentEl.classList.remove('hidden');
            const wp = document.getElementById(`writingPulse_${msgId}`);
            if (wp) wp.remove();
            const extraBoardTag = toolDoneEvt?.tool === 'get_mcq_quiz' ? (toolDoneEvt.result?.quiz?.[0]?.all_board_tags || toolDoneEvt.result?.quiz?.[0]?.formatted_source || (toolDoneEvt.args?.board ? toolDoneEvt.args.board + ' বোর্ড' : '')) : null;
            const extraAns = toolDoneEvt?.tool === 'get_mcq_quiz' ? (toolDoneEvt.result?.quiz?.[0]?.answer || '') : null;
            contentEl.innerHTML = renderFormattedContentWithCursor(streamContent, true, extraBoardTag, extraAns);
          }
          scrollToBottom();
        }
      }

      function parseStreamThoughts(raw) {
        if (!raw) return { hasThought: false, inProgress: false, thought: '', answer: '' };

        // Find all closed thoughts
        const thoughtRegex = /<[\s]*(?:thought|thinking|চিন্তা|ভাবনা|স্ট্যাটাস|status)[\s]*>([\s\S]*?)<[\s]*\/[\s]*(?:thought|thinking|চিন্তা|ভাবনা|স্ট্যাটাস|status)[\s]*>/gi;
        const allThoughts = [];
        let lastClosedEnd = 0;
        let m;
        while ((m = thoughtRegex.exec(raw)) !== null) {
          allThoughts.push(m[1].trim());
          lastClosedEnd = m.index + m[0].length;
        }

        const remaining = raw.slice(lastClosedEnd);
        const inProgressOpen = remaining.match(/<[\s]*(?:thought|thinking|চিন্তা|ভাবনা|স্ট্যাটাস|status)[\s]*>/i);
        if (inProgressOpen) {
          const inProgressText = remaining.slice(inProgressOpen.index + inProgressOpen[0].length).trimStart();
          const combinedThought = allThoughts.concat([inProgressText]).filter(Boolean).join(' ');
          return { hasThought: true, inProgress: true, thought: combinedThought, answer: remaining.slice(0, inProgressOpen.index).trimStart() };
        }

        if (allThoughts.length > 0) {
          return { hasThought: true, inProgress: false, thought: allThoughts.join(' '), answer: remaining.trimStart() };
        }

        // Check if raw starts with an incomplete opening tag like `<` or `< thought`
        if (/^<[\s]*(?:thought|thinking|চিন্তা|ভাবনা|স্ট্যাটাস|status)?[^>]*$/i.test(raw.trim())) {
          return { hasThought: false, inProgress: true, thought: '', answer: '' };
        }

        return { hasThought: false, inProgress: false, thought: '', answer: raw };
      }

      try {
        const currSession = chatSessions.find(s => s.id === currentSessionId);
        const res = await fetch('/api/chat/stream', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            message: text,
            history: conversationHistory,
            state: currSession ? currSession.state : null
          })
        });

        if (!res.ok) throw new Error('HTTP ' + res.status);

        const reader = res.body.getReader();
        const decoder = new TextDecoder('utf-8');
        let buffer = "";

        while (true) {
          const { done, value } = await reader.read();
          if (done) {
            if (buffer.trim()) handleSseChunk(buffer);
            break;
          }
          buffer += decoder.decode(value, { stream: true });
          const parts = buffer.split("\n\n");
          buffer = parts.pop();
          for (const p of parts) handleSseChunk(p);
        }

        function handleSseChunk(chunk) {
          const lines = chunk.split("\n");
          for (const line of lines) {
            const trimmed = line.trim();
            if (!trimmed.startsWith("data:")) continue;
            const raw = trimmed.replace(/^data:\s*/, "").trim();
            if (!raw) continue;

            try {
              const data = JSON.parse(raw);

              if (data.type === "error") {
                console.error("[SSE Error]", data.error);
                isThinkingActive = false;
                const statusEl = document.getElementById(statusId);
                if (statusEl) statusEl.classList.add('hidden');
                const wp = document.getElementById(`writingPulse_${msgId}`);
                if (wp) wp.remove();
                const contentEl = document.getElementById(contentId);
                if (contentEl) {
                  contentEl.classList.remove('hidden');
                  contentEl.innerHTML = `<span class="text-rose-400 font-mono text-xs">ত্রুটি: ${escapeHtml(data.error || 'অপ্রত্যাশিত সমস্যা হয়েছে। অনুগ্রহ করে আবার চেষ্টা করুন।')}</span>`;
                }
                scrollToBottom();
                return;
              }

              if (data.type === "state_sync" && data.state) {
                const currSession = chatSessions.find(s => s.id === currentSessionId);
                if (currSession) {
                  currSession.state = data.state;
                  saveSessions();
                }
              }

              if (data.type === "thought_done") {
                onThinkingFinished(toolStepIndex || 1);
              }

              // 1. Tool Start -> Queue or Render Tool step after thinking finishes
              if (data.type === "tool_start") {
                toolStepIndex++;
                streamContent = "";
                const contentEl = document.getElementById(contentId);
                if (contentEl) {
                  contentEl.classList.add('hidden');
                  contentEl.innerHTML = "";
                }
                toolStartEvt = data;
                hasTool = true;

                const statusEl = document.getElementById(statusId);
                if (statusEl) statusEl.classList.add('hidden');
                const toolContainer = document.getElementById(toolContainerId);
                if (toolContainer) toolContainer.classList.remove('hidden');

                const titleEl = document.getElementById(treeTitleId);
                const startData = generateThoughtTreeData(data.tool, data.args, null, text);
                if (titleEl && startData.mainTitle) titleEl.innerText = startData.mainTitle;

                const treeEl = document.getElementById(treeId);
                const step1TextEl = document.getElementById(`step1Text_${msgId}`);

                if (toolStepIndex === 1) {
                  if (!step1TextEl && treeEl) {
                    const authenticThought = startData.intentReasoning || "অধ্যায় ও বিষয়বস্তু বিশ্লেষণ করে উপযুক্ত প্রশ্ন বাছাই করার সিদ্ধান্ত নেওয়া হয়েছে।";
                    initialThoughtCaptured = authenticThought;
                    treeEl.innerHTML = `
                      <div class="thought-step" id="step1_${msgId}">
                        <div class="flex items-center gap-1.5 text-zinc-400 hover:text-zinc-200 cursor-pointer font-medium" onclick="toggleSubStep(this)">
                          <span class="text-zinc-500 font-bold">•</span>
                          <span>Think</span>
                          <svg class="w-3 h-3 text-zinc-500 transition-transform" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/></svg>
                        </div>
                        <div class="thought-sub-content pl-3 pt-1 text-[11.5px] text-zinc-400 leading-relaxed font-sans" id="step1Text_${msgId}"></div>
                      </div>
                    `;
                    isThinkingActive = true;
                    pendingToolStart = { data, stepIdx: 1 };
                    streamThinkingText(document.getElementById(`step1Text_${msgId}`), authenticThought, 10, () => {
                      onThinkingFinished(1);
                    });
                  } else if (isThinkingActive) {
                    pendingToolStart = { data, stepIdx: 1 };
                  } else {
                    renderToolRow(data, 1);
                  }
                } else {
                  // Subsequent tool step
                  const thinkId = `stepThinkText_${toolStepIndex}_${msgId}`;
                  const authenticThought = startData.intentReasoning || "পরবর্তী ধাপে প্রয়োজনীয় তথ্য অনুসন্ধান করছি...";
                  const thinkHtml = `
                    <div class="thought-step pt-1" id="stepThink_${toolStepIndex}_${msgId}">
                      <div class="flex items-center gap-1.5 text-zinc-400 hover:text-zinc-200 cursor-pointer font-medium" onclick="toggleSubStep(this)">
                        <span class="text-zinc-500 font-bold">•</span>
                        <span>Think (ধাপ ${toBnDigits(toolStepIndex)})</span>
                        <svg class="w-3 h-3 text-zinc-500 transition-transform" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/></svg>
                      </div>
                      <div class="thought-sub-content pl-3 pt-1 text-[11.5px] text-zinc-400 leading-relaxed font-sans" id="${thinkId}"></div>
                    </div>
                  `;
                  if (treeEl) treeEl.insertAdjacentHTML('beforeend', thinkHtml);
                  isThinkingActive = true;
                  pendingToolStart = { data, stepIdx: toolStepIndex };
                  streamThinkingText(document.getElementById(thinkId), authenticThought, 10, () => {
                    onThinkingFinished(toolStepIndex);
                  });
                }
              }

              // 2. Tool Done -> Update badge or queue if thinking is still streaming
              if (data.type === "tool_done") {
                toolDoneEvt = data;
                hasTool = true;

                if (thinkTimer) {
                  clearInterval(thinkTimer);
                  thinkTimer = null;
                }

                if (document.getElementById(`stepTool_${toolStepIndex}_${msgId}`)) {
                  setTimeout(() => {
                    resolveToolDone(data, toolStepIndex);
                  }, 100);
                } else {
                  pendingToolDone = { data, stepIdx: toolStepIndex };
                }
              }

              // 2b. Generating Start -> Show writing pulse immediately so screen is never blank
              if (data.type === "generating_start") {
                if (!isThinkingActive) {
                  const statusEl = document.getElementById(statusId);
                  if (statusEl) statusEl.classList.add('hidden');

                  const contentEl = document.getElementById(contentId);
                  if (contentEl && !contentEl.innerHTML.trim()) {
                    contentEl.classList.remove('hidden');
                    contentEl.innerHTML = `
                      <div class="flex items-center gap-2 text-xs text-zinc-400 py-1.5 select-none" id="writingPulse_${msgId}">
                        <span class="inline-block w-1.5 h-1.5 rounded-full bg-emerald-400 animate-ping"></span>
                        <span class="thinking-shimmer font-medium tracking-wide text-zinc-300">উত্তর সাজানো হচ্ছে...</span>
                      </div>
                    `;
                    scrollToBottom();
                  }
                }
              }

              // 3. Content Delta -> Batched rAF Streaming (Zero browser lockup/lag)
              if (data.type === "content_delta" && data.delta) {
                isToolExecuting = false;
                streamContent += data.delta;
                scheduleStreamRender();
              }

              // 4. Done Event -> Final crisp render
              if (data.type === "done") {
                onThinkingFinished(toolStepIndex || 1);
                isToolExecuting = false;
                if (renderRafId) {
                  cancelAnimationFrame(renderRafId);
                  renderRafId = null;
                }

                const final = data.content || streamContent;
                const parsed = parseStreamThoughts(final);
                const cleanFinal = parsed.hasThought ? parsed.answer : final;

                const statusEl = document.getElementById(statusId);
                if (statusEl) statusEl.classList.add('hidden');

                const tEl = document.getElementById(`step1Text_${msgId}`);
                if (tEl) {
                  if (initialThoughtCaptured) {
                    tEl.innerText = initialThoughtCaptured;
                  } else if (parsed.thought) {
                    tEl.innerText = parsed.thought;
                  }
                }

                const contentEl = document.getElementById(contentId);
                if (contentEl) {
                  contentEl.classList.remove('hidden');
                  const extraBoardTag = toolDoneEvt?.tool === 'get_mcq_quiz' ? (toolDoneEvt.result?.quiz?.[0]?.all_board_tags || toolDoneEvt.result?.quiz?.[0]?.formatted_source || (toolDoneEvt.args?.board ? toolDoneEvt.args.board + ' বোর্ড' : '')) : null;
                  const extraAns = toolDoneEvt?.tool === 'get_mcq_quiz' ? (toolDoneEvt.result?.quiz?.[0]?.answer || '') : null;
                  if (cleanFinal) contentEl.innerHTML = renderFormattedContentWithCursor(cleanFinal, false, extraBoardTag, extraAns);
                }
                conversationHistory.push({ role: "user", content: text });
                conversationHistory.push({ role: "assistant", content: cleanFinal });

                // Persist conversation and rendered messages to current session
                const currSession = chatSessions.find(s => s.id === currentSessionId);
                if (currSession) {
                  currSession.updatedAt = Date.now();
                  if (data.state) {
                    currSession.state = data.state;
                  }
                  currSession.conversationHistory = JSON.parse(JSON.stringify(conversationHistory));
                  const areaEl = document.getElementById('messagesArea');
                  if (areaEl) {
                    const clone = areaEl.cloneNode(true);
                    clone.querySelectorAll('.streaming-cursor, .thought-cursor, [id^="writingPulse_"]').forEach(el => el.remove());
                    currSession.html = clone.innerHTML;
                  }
                  saveSessions();
                  renderRecentChats();
                }
                scrollToBottom();
              }

            } catch(e) {}
          }
        }

      } catch (err) {
        const contentEl = document.getElementById(contentId);
        const statusEl = document.getElementById(statusId);
        if (statusEl) statusEl.classList.add('hidden');
        if (contentEl) {
          contentEl.classList.remove('hidden');
          contentEl.innerHTML = `<span class="text-rose-400 font-mono text-xs">ত্রুটি: ${escapeHtml(err.message)}</span>`;
        }
      } finally {
        isProcessing = false;
        if (sendBtn) {
          sendBtn.disabled = false;
          sendBtn.classList.remove('opacity-40');
        }
      }
    }

    let scrollRaf = null;
    function scrollToBottom() {
      if (scrollRaf) return;
      scrollRaf = requestAnimationFrame(() => {
        scrollRaf = null;
        const el = document.getElementById('contentScrollArea');
        if (el) el.scrollTop = el.scrollHeight;
      });
    }

    // Auto-resize docked textarea
    const dockedInp = document.getElementById('dockedInput');
    if (dockedInp) {
      dockedInp.addEventListener('input', function() {
        this.style.height = 'auto';
        this.style.height = Math.min(this.scrollHeight, 120) + 'px';
      });
    }

    // Keyboard Shortcuts (Ctrl+K = New Chat)
    document.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
        e.preventDefault();
        resetToHome();
      }
    });

    renderRecentChats();
  </script>
</body>
</html>
